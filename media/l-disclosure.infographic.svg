<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1725" width="900" height="1725" role="img" aria-labelledby="t d" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC','Microsoft YaHei',sans-serif">
<title id="t">没有体检、申请很快，是不是病史就不用认真填？</title>
<desc id="d">不是。免体检只是少了抽血化验这一步，告知义务一项没少：BC 法律要求投保人和被保险人把自己知道的、对承保有实质影响的事实告诉保险公司。答错或漏答，可能影响合同和日后理赔。</desc>
<rect width="900" height="1725" fill="#FAFBFC"/>
<rect x="0" y="0" width="900" height="122" rx="0" fill="#12355B"/>
<text x="40" y="46" font-size="18" fill="#BFD3E6" font-weight="500" text-anchor="start">免体检与如实告知 · 信息图</text>
<text x="40" y="92" font-size="30" fill="#FFFFFF" font-weight="700" text-anchor="start">没有体检、申请很快，是不是病史就不用认真填？</text>
<rect x="40" y="146" width="820" height="165" rx="16" fill="#FFFFFF" stroke="#12355B" stroke-width="2"/>
<text x="64" y="177" font-size="17" fill="#0E7C7B" font-weight="700" text-anchor="start">一句话答案</text>
<text x="64" y="213" font-size="21" fill="#1F2A37" font-weight="600" text-anchor="start">不是。免体检只是少了抽血化验这一步，告知义务一项没少：BC 法律要求投保人</text>
<text x="64" y="246" font-size="21" fill="#1F2A37" font-weight="600" text-anchor="start">和被保险人把自己知道的、对承保有实质影响的事实告诉保险公司。答错或漏答，</text>
<text x="64" y="279" font-size="21" fill="#1F2A37" font-weight="600" text-anchor="start">可能影响合同和日后理赔。</text>
<text x="40" y="355" font-size="22" fill="#12355B" font-weight="700" text-anchor="start">答错之后，时间线怎么走</text>
<rect x="40.0" y="375" width="264.0" height="219" rx="14" fill="#FDECEA" stroke="#B42318" stroke-width="1.5"/>
<text x="54.0" y="407" font-size="19" fill="#B42318" font-weight="700" text-anchor="start">生效未满 2 年</text>
<text x="54.0" y="435" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">漏报或误报重大事实</text>
<text x="54.0" y="457" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">保险公司可以主张撤销合同</text>
<text x="54.0" y="514" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">是不是无心之失</text>
<text x="54.0" y="536" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">这段时间里不看这一点</text>
<rect x="318.0" y="375" width="264.0" height="219" rx="14" fill="#E9F7EF" stroke="#1A7F4B" stroke-width="1.5"/>
<text x="332.0" y="407" font-size="19" fill="#1A7F4B" font-weight="700" text-anchor="start">生效满 2 年</text>
<text x="332.0" y="435" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">条件</text>
<text x="332.0" y="457" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">被保险人在世期间合同已有效满 </text>
<text x="332.0" y="480" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">2 年</text>
<text x="332.0" y="514" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">非欺诈的漏报误报</text>
<text x="332.0" y="536" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">一般不能再据此撤销合同</text>
<rect x="596.0" y="375" width="264.0" height="219" rx="14" fill="#FDECEA" stroke="#B42318" stroke-width="1.5"/>
<text x="610.0" y="407" font-size="19" fill="#B42318" font-weight="700" text-anchor="start">欺诈</text>
<text x="610.0" y="435" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">故意隐瞒或虚报</text>
<text x="610.0" y="457" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">不受 2 年保护</text>
<text x="610.0" y="514" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">年龄写错</text>
<text x="610.0" y="536" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">另按真实年龄调整保额，不走这</text>
<text x="610.0" y="560" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">条线</text>
<text x="40" y="638" font-size="22" fill="#12355B" font-weight="700" text-anchor="start">四件事分开看</text>
<rect x="40" y="656" width="820" height="129" rx="14" fill="#F4F6F9" stroke="#5B6B7F" stroke-width="1.5"/>
<text x="58" y="690" font-size="20" fill="#5B6B7F" font-weight="700" text-anchor="start">体检</text>
<circle cx="64" cy="719" r="3.2" fill="#5B6B7F"/>
<text x="76" y="724" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">抽血、验尿、心电图等，保险公司按金额和年龄决定要不要做</text>
<circle cx="64" cy="750" r="3.2" fill="#5B6B7F"/>
<text x="76" y="755" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">加速核保、简化承保都可能不安排体检</text>
<line x1="450" y1="787" x2="450" y2="814" stroke="#5B6B7F" stroke-width="2.5"/>
<path d="M442,811 L458,811 L450,823 Z" fill="#5B6B7F"/>
<text x="466" y="806" font-size="15" fill="#5B6B7F" font-weight="500" text-anchor="start">没有体检，还有问卷</text>
<rect x="40" y="825" width="820" height="129" rx="14" fill="#EAF1F8" stroke="#2F5D8A" stroke-width="1.5"/>
<text x="58" y="859" font-size="20" fill="#2F5D8A" font-weight="700" text-anchor="start">问卷</text>
<circle cx="64" cy="888" r="3.2" fill="#2F5D8A"/>
<text x="76" y="893" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">申请书上的健康与生活习惯问题，体检免了问卷照样要答</text>
<circle cx="64" cy="919" r="3.2" fill="#2F5D8A"/>
<text x="76" y="924" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">要本人逐题读、逐题答，不让别人替你推测答案</text>
<line x1="450" y1="956" x2="450" y2="983" stroke="#5B6B7F" stroke-width="2.5"/>
<path d="M442,980 L458,980 L450,992 Z" fill="#5B6B7F"/>
<text x="466" y="975" font-size="15" fill="#5B6B7F" font-weight="500" text-anchor="start">答案就是告知</text>
<rect x="40" y="994" width="820" height="160" rx="14" fill="#FFF4E5" stroke="#B45309" stroke-width="1.5"/>
<text x="58" y="1028" font-size="20" fill="#B45309" font-weight="700" text-anchor="start">告知义务</text>
<circle cx="64" cy="1057" r="3.2" fill="#B45309"/>
<text x="76" y="1062" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">申请书、体检（如有）和书面答复里，都要披露自己知道的重大事实</text>
<circle cx="64" cy="1088" r="3.2" fill="#B45309"/>
<text x="76" y="1093" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">保险公司还会查 MIB 编码、处方与驾驶记录等资料，自己独立评估</text>
<circle cx="64" cy="1120" r="3.2" fill="#B45309"/>
<text x="76" y="1125" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">申请到交付之间健康有变化，也要在交付前讲清</text>
<line x1="450" y1="1156" x2="450" y2="1183" stroke="#5B6B7F" stroke-width="2.5"/>
<path d="M442,1180 L458,1180 L450,1192 Z" fill="#5B6B7F"/>
<text x="466" y="1175" font-size="15" fill="#5B6B7F" font-weight="500" text-anchor="start">保险公司据此决定</text>
<rect x="40" y="1194" width="820" height="160" rx="14" fill="#E6F4F3" stroke="#0E7C7B" stroke-width="1.5"/>
<text x="58" y="1228" font-size="20" fill="#0E7C7B" font-weight="700" text-anchor="start">核保</text>
<circle cx="64" cy="1257" r="3.2" fill="#0E7C7B"/>
<text x="76" y="1262" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">加速核保：不体检但仍分级，可能被加费</text>
<circle cx="64" cy="1289" r="3.2" fill="#0E7C7B"/>
<text x="76" y="1294" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">简化承保：短表格加即时数据，直接接受或拒绝，保费通常整体偏高</text>
<circle cx="64" cy="1320" r="3.2" fill="#0E7C7B"/>
<text x="76" y="1325" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">传统核保、加速核保、简化承保，哪一种都要求如实回答</text>
<rect x="40" y="1377" width="820" height="160" rx="14" fill="#FFF4E5" stroke="#B45309" stroke-width="1.5"/>
<text x="58" y="1411" font-size="20" fill="#B45309" font-weight="700" text-anchor="start">最容易弄错</text>
<circle cx="64" cy="1440" r="3.2" fill="#B45309"/>
<text x="76" y="1445" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">「免体检就是免告知」：免的是体检，告知义务不变。</text>
<circle cx="64" cy="1471" r="3.2" fill="#B45309"/>
<text x="76" y="1476" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">「过了两年什么都保」：2 年保护只对非欺诈的漏报误报有效。</text>
<circle cx="64" cy="1503" r="3.2" fill="#B45309"/>
<text x="76" y="1508" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">「代理人帮我填的，错了不算我的」：申请书是合同的一部分，签字前本人逐项核对，留一份副本。</text>
<line x1="40" y1="1563" x2="860" y2="1563" stroke="#D5DEE8" stroke-width="1.5"/>
<text x="40" y="1588" font-size="15" fill="#5B6B7F" font-weight="700" text-anchor="start">来源</text>
<text x="40" y="1610" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">BC Insurance Act, Part 3 Life Insurance（s.51 告知、s.52 不可抗辩、s.54 年龄误报）· bclaws.gov.bc.ca，</text>
<text x="40" y="1631" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">2026-10-27 合并本</text>
<text x="40" y="1653" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">本站讲解页「投保与核保」</text>
<text x="40" y="1681" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">BC 口径；附加的伤残给付不适用 2 年不可抗辩这条。具体后果依法律和个案事实判断，本图不替任何申请预判结果。</text>
</svg>
