<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1932" width="900" height="1932" role="img" aria-labelledby="t d" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC','Microsoft YaHei',sans-serif">
<title id="t">指定了不可撤销受益人，我还能随意改人或处置保单吗？</title>
<desc id="d">不能随意。在 BC，不可撤销指定一旦按法定方式成立，只要这位受益人在世，投保人未经其同意不得变更或撤销这项指定；退保、保单贷款等会减少或终止其保险金的操作也要先拿到其书面同意。谁交保费不改变这一点，离婚也不会自动解除。</desc>
<rect width="900" height="1932" fill="#FAFBFC"/>
<rect x="0" y="0" width="900" height="122" rx="0" fill="#12355B"/>
<text x="40" y="46" font-size="18" fill="#BFD3E6" font-weight="500" text-anchor="start">受益人指定与控制权 · 信息图</text>
<text x="40" y="92" font-size="30" fill="#FFFFFF" font-weight="700" text-anchor="start">指定了不可撤销受益人，我还能随意改人或处置保单吗？</text>
<rect x="40" y="146" width="820" height="165" rx="16" fill="#FFFFFF" stroke="#12355B" stroke-width="2"/>
<text x="64" y="177" font-size="17" fill="#0E7C7B" font-weight="700" text-anchor="start">一句话答案</text>
<text x="64" y="213" font-size="21" fill="#1F2A37" font-weight="600" text-anchor="start">不能随意。在 BC，不可撤销指定一旦按法定方式成立，只要这位受益人在世，投</text>
<text x="64" y="246" font-size="21" fill="#1F2A37" font-weight="600" text-anchor="start">保人未经其同意不得变更或撤销这项指定；退保、保单贷款等会减少或终止其保险</text>
<text x="64" y="279" font-size="21" fill="#1F2A37" font-weight="600" text-anchor="start">金的操作也要先拿到其书面同意。谁交保费不改变这一点，离婚也不会自动解除。</text>
<text x="40" y="355" font-size="22" fill="#12355B" font-weight="700" text-anchor="start">三个角色，三种权利</text>
<rect x="40.0" y="375" width="264.0" height="345" rx="14" fill="#EAF1F8" stroke="#2F5D8A" stroke-width="1.5"/>
<text x="54.0" y="407" font-size="19" fill="#2F5D8A" font-weight="700" text-anchor="start">投保人（保单持有人）</text>
<text x="54.0" y="435" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">是谁</text>
<text x="54.0" y="457" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">签合同、交保费、持有保单权利</text>
<text x="54.0" y="480" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">的人</text>
<text x="54.0" y="514" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">一般权利</text>
<text x="54.0" y="536" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">指定受益人，并可用书面声明变</text>
<text x="54.0" y="560" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">更或撤销指定</text>
<text x="54.0" y="594" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">有不可撤销受益人时</text>
<text x="54.0" y="616" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">变更受益人、退保、保单贷款须</text>
<text x="54.0" y="639" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">这位受益人书面同意；转让可不</text>
<text x="54.0" y="662" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">经同意，但受让人的权益排在这</text>
<text x="54.0" y="685" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">位受益人之后</text>
<rect x="318.0" y="375" width="264.0" height="345" rx="14" fill="#F4F6F9" stroke="#5B6B7F" stroke-width="1.5"/>
<text x="332.0" y="407" font-size="19" fill="#5B6B7F" font-weight="700" text-anchor="start">被保险人</text>
<text x="332.0" y="435" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">是谁</text>
<text x="332.0" y="457" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">保险以其生命为对象的人，可以</text>
<text x="332.0" y="480" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">和投保人是同一人</text>
<text x="332.0" y="514" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">权利</text>
<text x="332.0" y="536" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">身份本身不带来改受益人的权利</text>
<text x="332.0" y="594" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">注意</text>
<text x="332.0" y="616" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">被保险人在世时完成送达，不可</text>
<text x="332.0" y="639" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">撤销指定才可能成立</text>
<rect x="596.0" y="375" width="264.0" height="345" rx="14" fill="#E9F7EF" stroke="#1A7F4B" stroke-width="1.5"/>
<text x="610.0" y="407" font-size="19" fill="#1A7F4B" font-weight="700" text-anchor="start">受益人</text>
<text x="610.0" y="435" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">可撤销</text>
<text x="610.0" y="457" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">投保人可用书面声明另行指定，</text>
<text x="610.0" y="480" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">受益人只有身故时的领款期待</text>
<text x="610.0" y="514" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">不可撤销</text>
<text x="610.0" y="536" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">在世期间，未经其同意不得变更</text>
<text x="610.0" y="560" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">或撤销这项指定</text>
<text x="610.0" y="594" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">身故给付</text>
<text x="610.0" y="616" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">指定了受益人的保险金不进投保</text>
<text x="610.0" y="639" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">人遗产，不受其债权人追偿</text>
<text x="40" y="764" font-size="22" fill="#12355B" font-weight="700" text-anchor="start">不可撤销指定怎样才成立</text>
<rect x="40" y="782" width="820" height="129" rx="14" fill="#EAF1F8" stroke="#2F5D8A" stroke-width="1.5"/>
<text x="58" y="816" font-size="20" fill="#2F5D8A" font-weight="700" text-anchor="start">第一步：书面指定</text>
<circle cx="64" cy="845" r="3.2" fill="#2F5D8A"/>
<text x="76" y="850" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">写在合同里，或用书面声明作出</text>
<circle cx="64" cy="876" r="3.2" fill="#2F5D8A"/>
<text x="76" y="881" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">写在遗嘱里的「不可撤销」不算，只按可撤销处理</text>
<line x1="450" y1="913" x2="450" y2="940" stroke="#5B6B7F" stroke-width="2.5"/>
<path d="M442,937 L458,937 L450,949 Z" fill="#5B6B7F"/>
<text x="466" y="932" font-size="15" fill="#5B6B7F" font-weight="500" text-anchor="start">然后送达</text>
<rect x="40" y="951" width="820" height="160" rx="14" fill="#E6F4F3" stroke="#0E7C7B" stroke-width="1.5"/>
<text x="58" y="985" font-size="20" fill="#0E7C7B" font-weight="700" text-anchor="start">第二步：送达保险公司</text>
<circle cx="64" cy="1014" r="3.2" fill="#0E7C7B"/>
<text x="76" y="1019" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">在被保险人在世期间，送达保险公司在加拿大的总部或主要办事处</text>
<circle cx="64" cy="1045" r="3.2" fill="#0E7C7B"/>
<text x="76" y="1050" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">没有按这个方式送达的，同样只按可撤销处理</text>
<circle cx="64" cy="1077" r="3.2" fill="#0E7C7B"/>
<text x="76" y="1082" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">交给代理人不等于送达总部，留存保险公司回执</text>
<line x1="450" y1="1113" x2="450" y2="1140" stroke="#5B6B7F" stroke-width="2.5"/>
<path d="M442,1137 L458,1137 L450,1149 Z" fill="#5B6B7F"/>
<text x="466" y="1132" font-size="15" fill="#5B6B7F" font-weight="500" text-anchor="start">成立之后</text>
<rect x="40" y="1151" width="820" height="218" rx="14" fill="#FFF4E5" stroke="#B45309" stroke-width="1.5"/>
<text x="58" y="1185" font-size="20" fill="#B45309" font-weight="700" text-anchor="start">第三步：成立后的效果</text>
<circle cx="64" cy="1214" r="3.2" fill="#B45309"/>
<text x="76" y="1219" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">受益人在世期间，改人或撤销须其同意</text>
<circle cx="64" cy="1246" r="3.2" fill="#B45309"/>
<text x="76" y="1251" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">身故金不进投保人遗产，按 s.65 不受投保人债权人追偿</text>
<circle cx="64" cy="1277" r="3.2" fill="#B45309"/>
<text x="76" y="1282" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">退保、保单贷款等会减少或终止其保险金的操作，同样须其同意</text>
<circle cx="64" cy="1309" r="3.2" fill="#B45309"/>
<text x="76" y="1314" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">Insurance Regulation s.9.1 列出可不经同意的操作（如增加保额、账户间转换、转让），前</text>
<text x="76" y="1339" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">提是不减少其保险金或利益，也不取消或退保这项指定所涉及的保单、保障或条款</text>
<rect x="40" y="1391" width="820" height="129" rx="14" fill="#FDECEA" stroke="#B42318" stroke-width="1.5"/>
<text x="58" y="1425" font-size="20" fill="#B42318" font-weight="700" text-anchor="start">家庭变化时</text>
<circle cx="64" cy="1454" r="3.2" fill="#B42318"/>
<text x="76" y="1459" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">离婚协议里写「放弃对方保单权益」，保险公司不是当事方，指定照旧有效</text>
<circle cx="64" cy="1485" r="3.2" fill="#B42318"/>
<text x="76" y="1490" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">要解除，须这位受益人另签保险公司的同意或释放文件并送达保险公司</text>
<rect x="40" y="1542" width="820" height="160" rx="14" fill="#FFF4E5" stroke="#B45309" stroke-width="1.5"/>
<text x="58" y="1576" font-size="20" fill="#B45309" font-weight="700" text-anchor="start">最容易弄错</text>
<circle cx="64" cy="1605" r="3.2" fill="#B45309"/>
<text x="76" y="1610" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">「保费一直是我交的，我想改给谁就改给谁」：不可撤销指定看的是受益人同意，不看谁交钱。</text>
<circle cx="64" cy="1636" r="3.2" fill="#B45309"/>
<text x="76" y="1641" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">「离婚了就自动作废」：离婚本身不解除不可撤销指定。</text>
<circle cx="64" cy="1668" r="3.2" fill="#B45309"/>
<text x="76" y="1673" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">「申请书上勾一格就行」：要按法定方式书面指定并送达保险公司总部，才是不可撤销。</text>
<line x1="40" y1="1728" x2="860" y2="1728" stroke="#D5DEE8" stroke-width="1.5"/>
<text x="40" y="1753" font-size="15" fill="#5B6B7F" font-weight="700" text-anchor="start">来源</text>
<text x="40" y="1775" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">BC Insurance Act, Part 3 Life Insurance（s.59、s.60、s.65、s.66）· bclaws.gov.bc.ca，2026-10-27 合并</text>
<text x="40" y="1795" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">本</text>
<text x="40" y="1818" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">BC Insurance Regulation（B.C. Reg. 403/2012）s.9.1 · bclaws.gov.bc.ca，2026-11-02 回读</text>
<text x="40" y="1840" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">本站讲解页「保单条款」受益人与转让两节</text>
<text x="40" y="1868" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">BC 口径；其他省须另核。本图讲规则怎么走，不替个案判断某项操作是否须同意，遇到离婚、债务或转让请以保险公司文件和律师</text>
<text x="40" y="1889" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">意见为准。</text>
</svg>
