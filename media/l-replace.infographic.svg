<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1738" width="900" height="1738" role="img" aria-labelledby="t d" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC','Microsoft YaHei',sans-serif">
<title id="t">新保单报价便宜，能不能先退旧保单再等新单批下来？</title>
<desc id="d">不要先退。新单要重新核保，可能加费、除外甚至拒保；旧单一旦退掉，以当时的年龄和健康大多买不回来。稳妥的顺序是：新单生效、条款你也接受了，再停旧单。</desc>
<rect width="900" height="1738" fill="#FAFBFC"/>
<rect x="0" y="0" width="900" height="122" rx="0" fill="#12355B"/>
<text x="40" y="46" font-size="18" fill="#BFD3E6" font-weight="500" text-anchor="start">换保单前的保障空档 · 信息图</text>
<text x="40" y="92" font-size="30" fill="#FFFFFF" font-weight="700" text-anchor="start">新保单报价便宜，能不能先退旧保单再等新单批下来？</text>
<rect x="40" y="146" width="820" height="165" rx="16" fill="#FFFFFF" stroke="#12355B" stroke-width="2"/>
<text x="64" y="177" font-size="17" fill="#0E7C7B" font-weight="700" text-anchor="start">一句话答案</text>
<text x="64" y="213" font-size="21" fill="#1F2A37" font-weight="600" text-anchor="start">不要先退。新单要重新核保，可能加费、除外甚至拒保；旧单一旦退掉，以当时的</text>
<text x="64" y="246" font-size="21" fill="#1F2A37" font-weight="600" text-anchor="start">年龄和健康大多买不回来。稳妥的顺序是：新单生效、条款你也接受了，再停旧</text>
<text x="64" y="279" font-size="21" fill="#1F2A37" font-weight="600" text-anchor="start">单。</text>
<text x="40" y="355" font-size="22" fill="#12355B" font-weight="700" text-anchor="start">先退旧单，空档里会发生什么</text>
<rect x="40.0" y="375" width="403.0" height="252" rx="14" fill="#FDECEA" stroke="#B42318" stroke-width="1.5"/>
<text x="54.0" y="407" font-size="19" fill="#B42318" font-weight="700" text-anchor="start">保障空档</text>
<text x="54.0" y="435" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">旧单已退、新单未生效</text>
<text x="54.0" y="457" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">这期间出事，两边可能都不赔</text>
<text x="54.0" y="514" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">新单被拒保或加费</text>
<text x="54.0" y="536" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">旧单若已退保，通常回不来</text>
<rect x="457.0" y="375" width="403.0" height="252" rx="14" fill="#F4F6F9" stroke="#5B6B7F" stroke-width="1.5"/>
<text x="471.0" y="407" font-size="19" fill="#5B6B7F" font-weight="700" text-anchor="start">失去的旧单价值</text>
<text x="471.0" y="435" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">原发单时的健康等级</text>
<text x="471.0" y="457" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">续保沿用原核保的健康等级，但续保保费仍随年龄上</text>
<text x="471.0" y="480" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">涨</text>
<text x="471.0" y="514" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">已过的 2 年不可抗辩期</text>
<text x="471.0" y="536" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">换新单后重新起算</text>
<text x="471.0" y="571" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">现金价值</text>
<text x="471.0" y="593" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">退保可能有费用，新单要重新积累</text>
<text x="40" y="671" font-size="22" fill="#12355B" font-weight="700" text-anchor="start">正确的时间线</text>
<rect x="40" y="689" width="820" height="129" rx="14" fill="#EAF1F8" stroke="#2F5D8A" stroke-width="1.5"/>
<text x="58" y="723" font-size="20" fill="#2F5D8A" font-weight="700" text-anchor="start">① 先比条款，不只比报价</text>
<circle cx="64" cy="752" r="3.2" fill="#2F5D8A"/>
<text x="76" y="757" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">新旧两份并排：保额、保费是否保证、除外、现金价值、附加保障</text>
<circle cx="64" cy="783" r="3.2" fill="#2F5D8A"/>
<text x="76" y="788" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">先问原保险公司能否在原合同上调整，原合同里的转换权也可能是另一条路</text>
<line x1="450" y1="820" x2="450" y2="847" stroke="#5B6B7F" stroke-width="2.5"/>
<path d="M442,844 L458,844 L450,856 Z" fill="#5B6B7F"/>
<text x="466" y="839" font-size="15" fill="#5B6B7F" font-weight="500" text-anchor="start">决定申请新单</text>
<rect x="40" y="858" width="820" height="129" rx="14" fill="#E6F4F3" stroke="#0E7C7B" stroke-width="1.5"/>
<text x="58" y="892" font-size="20" fill="#0E7C7B" font-weight="700" text-anchor="start">② 申请新单（旧单照常缴费）</text>
<circle cx="64" cy="921" r="3.2" fill="#0E7C7B"/>
<text x="76" y="926" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">BC 规定：属于替换的，代理人在接新申请前要讲解替换声明，申请人签字，被保险人不同的也要签</text>
<circle cx="64" cy="952" r="3.2" fill="#0E7C7B"/>
<text x="76" y="957" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">签替换声明之日起 20 天内，申请人可以书面撤回这份申请</text>
<line x1="450" y1="989" x2="450" y2="1016" stroke="#5B6B7F" stroke-width="2.5"/>
<path d="M442,1013 L458,1013 L450,1025 Z" fill="#5B6B7F"/>
<text x="466" y="1008" font-size="15" fill="#5B6B7F" font-weight="500" text-anchor="start">等核保结论</text>
<rect x="40" y="1027" width="820" height="129" rx="14" fill="#FFF4E5" stroke="#B45309" stroke-width="1.5"/>
<text x="58" y="1061" font-size="20" fill="#B45309" font-weight="700" text-anchor="start">③ 新单核保与交付</text>
<circle cx="64" cy="1090" r="3.2" fill="#B45309"/>
<text x="76" y="1095" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">新单按现在的年龄和健康重新核保，结果可能和报价不同</text>
<circle cx="64" cy="1121" r="3.2" fill="#B45309"/>
<text x="76" y="1126" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">新单生效后，不可抗辩期从头算 2 年，这两年里保险公司仍可因漏报误报主张撤销</text>
<line x1="450" y1="1158" x2="450" y2="1185" stroke="#5B6B7F" stroke-width="2.5"/>
<path d="M442,1182 L458,1182 L450,1194 Z" fill="#5B6B7F"/>
<text x="466" y="1177" font-size="15" fill="#5B6B7F" font-weight="500" text-anchor="start">生效并接受之后</text>
<rect x="40" y="1196" width="820" height="129" rx="14" fill="#E9F7EF" stroke="#1A7F4B" stroke-width="1.5"/>
<text x="58" y="1230" font-size="20" fill="#1A7F4B" font-weight="700" text-anchor="start">④ 才处理旧单</text>
<circle cx="64" cy="1259" r="3.2" fill="#1A7F4B"/>
<text x="76" y="1264" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">确认新单已生效、条款可以接受，再退保或让旧单停止</text>
<circle cx="64" cy="1290" r="3.2" fill="#1A7F4B"/>
<text x="76" y="1295" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">旧单停止前的每一天，保障都还靠它</text>
<rect x="40" y="1347" width="820" height="160" rx="14" fill="#FFF4E5" stroke="#B45309" stroke-width="1.5"/>
<text x="58" y="1381" font-size="20" fill="#B45309" font-weight="700" text-anchor="start">最容易弄错</text>
<circle cx="64" cy="1410" r="3.2" fill="#B45309"/>
<text x="76" y="1415" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">「同一个人换一份保单，只是价格变了」：核保、条款限制和保障连续性都可能变。</text>
<circle cx="64" cy="1441" r="3.2" fill="#B45309"/>
<text x="76" y="1446" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">「是我自己要换的，就不用走替换披露」：是否属于替换按法规定义判断，不看谁提出。</text>
<circle cx="64" cy="1473" r="3.2" fill="#B45309"/>
<text x="76" y="1478" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">「先退旧单，新单反正会批」：核保结论出来之前，谁也不能保证。</text>
<line x1="40" y1="1533" x2="860" y2="1533" stroke="#D5DEE8" stroke-width="1.5"/>
<text x="40" y="1558" font-size="15" fill="#5B6B7F" font-weight="700" text-anchor="start">来源</text>
<text x="40" y="1580" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">BC Insurance Contracts (Replacement of Life Insurance) Regulation 327/90，s.1、s.3、s.4 · bclaws.g</text>
<text x="40" y="1601" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">ov.bc.ca，2026-10-27 合并本</text>
<text x="40" y="1623" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">Insurance Council of BC · Code of Conduct（重大事实完整公平披露）</text>
<text x="40" y="1645" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">本站讲解页「提出推荐」替换一节</text>
<text x="40" y="1673" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">BC 口径。是否属于替换以法规 s.1 定义为准，行使原合同权利、被替换的是年金、改为团体险等有明列排除。本图不判断某次换</text>
<text x="40" y="1694" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">单是否划算。</text>
</svg>
