<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1900" width="900" height="1900" role="img" aria-labelledby="t d" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC','Microsoft YaHei',sans-serif">
<title id="t">家人需要多少寿险，能不能直接按工资倍数买？</title>
<desc id="d">倍数只能粗估量级。收入差不多的两个家庭，房贷、孩子年龄、已有保障和存款都可能完全不同，真正该买的是「家人要付的账」减去「已经有的钱」之后剩下的缺口。</desc>
<rect width="900" height="1900" fill="#FAFBFC"/>
<rect x="0" y="0" width="900" height="122" rx="0" fill="#12355B"/>
<text x="40" y="46" font-size="18" fill="#BFD3E6" font-weight="500" text-anchor="start">保障缺口先于产品 · 信息图</text>
<text x="40" y="92" font-size="30" fill="#FFFFFF" font-weight="700" text-anchor="start">家人需要多少寿险，能不能直接按工资倍数买？</text>
<rect x="40" y="146" width="820" height="165" rx="16" fill="#FFFFFF" stroke="#12355B" stroke-width="2"/>
<text x="64" y="177" font-size="17" fill="#0E7C7B" font-weight="700" text-anchor="start">一句话答案</text>
<text x="64" y="213" font-size="21" fill="#1F2A37" font-weight="600" text-anchor="start">倍数只能粗估量级。收入差不多的两个家庭，房贷、孩子年龄、已有保障和存款都</text>
<text x="64" y="246" font-size="21" fill="#1F2A37" font-weight="600" text-anchor="start">可能完全不同，真正该买的是「家人要付的账」减去「已经有的钱」之后剩下的缺</text>
<text x="64" y="279" font-size="21" fill="#1F2A37" font-weight="600" text-anchor="start">口。</text>
<text x="40" y="355" font-size="22" fill="#12355B" font-weight="700" text-anchor="start">缺口＝左边减右边</text>
<rect x="40.0" y="375" width="403.0" height="378" rx="14" fill="#FDECEA" stroke="#B42318" stroke-width="1.5"/>
<text x="54.0" y="407" font-size="19" fill="#B42318" font-weight="700" text-anchor="start">家人要付的账</text>
<text x="54.0" y="435" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">每月生活</text>
<text x="54.0" y="457" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">身故后家庭每月开支，扣掉遗属每月仍有的收入，剩</text>
<text x="54.0" y="480" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">下的月缺口要覆盖几年</text>
<text x="54.0" y="514" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">一次性</text>
<text x="54.0" y="536" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">按揭余额（不是房屋市值）、其他债务、丧葬费</text>
<text x="54.0" y="594" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">未来专项</text>
<text x="54.0" y="616" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">教育、照护等，扣除已为它存的专款</text>
<text x="54.0" y="650" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">税款</text>
<text x="54.0" y="672" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">身故当年报税可能产生的税款</text>
<rect x="457.0" y="375" width="403.0" height="378" rx="14" fill="#E9F7EF" stroke="#1A7F4B" stroke-width="1.5"/>
<text x="471.0" y="407" font-size="19" fill="#1A7F4B" font-weight="700" text-anchor="start">已经有的钱</text>
<text x="471.0" y="435" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">可动用资产</text>
<text x="471.0" y="457" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">家人真能动用、不另有用途的存款与投资</text>
<text x="471.0" y="514" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">既有保障</text>
<text x="471.0" y="536" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">团体寿险、个人寿险，确认身故可赔、不在别处重复</text>
<text x="471.0" y="560" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">计算</text>
<text x="471.0" y="594" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">政府给付</text>
<text x="471.0" y="616" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">如 CPP 遗属与子女给付，按核定数额与年限计入</text>
<text x="471.0" y="650" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">要另核的两类</text>
<text x="471.0" y="672" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">公司保单核它的用途与可动用范围（如留作买卖协</text>
<text x="471.0" y="695" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">议），不重复计算；团体险核身故时是否仍有效可</text>
<text x="471.0" y="718" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">赔，并考虑离职、退休后的缺口</text>
<text x="40" y="797" font-size="22" fill="#12355B" font-weight="700" text-anchor="start">算缺口的四步</text>
<rect x="40" y="815" width="820" height="129" rx="14" fill="#EAF1F8" stroke="#2F5D8A" stroke-width="1.5"/>
<text x="58" y="849" font-size="20" fill="#2F5D8A" font-weight="700" text-anchor="start">第一步：月缺口</text>
<circle cx="64" cy="878" r="3.2" fill="#2F5D8A"/>
<text x="76" y="883" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">身故后每月开支减去遗属每月收入</text>
<circle cx="64" cy="909" r="3.2" fill="#2F5D8A"/>
<text x="76" y="914" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">例：$2,600 − $307.81 ＝ $2,292.19</text>
<line x1="450" y1="946" x2="450" y2="973" stroke="#5B6B7F" stroke-width="2.5"/>
<path d="M442,970 L458,970 L450,982 Z" fill="#5B6B7F"/>
<text x="466" y="965" font-size="15" fill="#5B6B7F" font-weight="500" text-anchor="start">乘上要覆盖的年数</text>
<rect x="40" y="984" width="820" height="160" rx="14" fill="#E6F4F3" stroke="#0E7C7B" stroke-width="1.5"/>
<text x="58" y="1018" font-size="20" fill="#0E7C7B" font-weight="700" text-anchor="start">第二步：把月缺口变成一笔钱</text>
<circle cx="64" cy="1047" r="3.2" fill="#0E7C7B"/>
<text x="76" y="1052" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">有明确终点的需求（如孩子到某个年龄）用耗尽法：本金逐年花完</text>
<circle cx="64" cy="1078" r="3.2" fill="#0E7C7B"/>
<text x="76" y="1083" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">不假设收益刚好抵消通胀时，要按你自己的回报和通胀假设折现</text>
<circle cx="64" cy="1110" r="3.2" fill="#0E7C7B"/>
<text x="76" y="1115" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">例（零实际净收益）：$2,292.19 × 12 × 10 ≈ $275,000</text>
<line x1="450" y1="1146" x2="450" y2="1173" stroke="#5B6B7F" stroke-width="2.5"/>
<path d="M442,1170 L458,1170 L450,1182 Z" fill="#5B6B7F"/>
<text x="466" y="1165" font-size="15" fill="#5B6B7F" font-weight="500" text-anchor="start">加上一次性需求</text>
<rect x="40" y="1184" width="820" height="129" rx="14" fill="#FFF4E5" stroke="#B45309" stroke-width="1.5"/>
<text x="58" y="1218" font-size="20" fill="#B45309" font-weight="700" text-anchor="start">第三步：总需求</text>
<circle cx="64" cy="1247" r="3.2" fill="#B45309"/>
<text x="76" y="1252" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">例：按揭余额 $410,000 ＋ 丧葬 $15,000 ＝ $425,000</text>
<circle cx="64" cy="1279" r="3.2" fill="#B45309"/>
<text x="76" y="1284" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">$275,000 ＋ $425,000 ＝ $700,000</text>
<line x1="450" y1="1315" x2="450" y2="1342" stroke="#5B6B7F" stroke-width="2.5"/>
<path d="M442,1339 L458,1339 L450,1351 Z" fill="#5B6B7F"/>
<text x="466" y="1334" font-size="15" fill="#5B6B7F" font-weight="500" text-anchor="start">减去已经有的</text>
<rect x="40" y="1353" width="820" height="129" rx="14" fill="#E9F7EF" stroke="#1A7F4B" stroke-width="1.5"/>
<text x="58" y="1387" font-size="20" fill="#1A7F4B" font-weight="700" text-anchor="start">第四步：建议新增保额</text>
<circle cx="64" cy="1416" r="3.2" fill="#1A7F4B"/>
<text x="76" y="1421" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">总需求减可动用资产、再减既有保障</text>
<circle cx="64" cy="1448" r="3.2" fill="#1A7F4B"/>
<text x="76" y="1453" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">例：$700,000 − 团体寿险 $100,000 ＝ $600,000</text>
<rect x="40" y="1504" width="820" height="186" rx="14" fill="#FFF4E5" stroke="#B45309" stroke-width="1.5"/>
<text x="58" y="1538" font-size="20" fill="#B45309" font-weight="700" text-anchor="start">最容易弄错</text>
<circle cx="64" cy="1567" r="3.2" fill="#B45309"/>
<text x="76" y="1572" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">「收入相近，保额就该一样」：需求由家庭责任和已有资源决定。</text>
<circle cx="64" cy="1599" r="3.2" fill="#B45309"/>
<text x="76" y="1604" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">「房子值多少就保多少」：要还的是按揭余额，不是市值。</text>
<circle cx="64" cy="1630" r="3.2" fill="#B45309"/>
<text x="76" y="1635" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">「公司给的团体险不用算」：确认身故时有效可赔后要减掉，否则重复付费；离职或退休后可能没有，</text>
<text x="76" y="1661" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">这个缺口另作打算。</text>
<line x1="40" y1="1716" x2="860" y2="1716" stroke="#D5DEE8" stroke-width="1.5"/>
<text x="40" y="1741" font-size="15" fill="#5B6B7F" font-weight="700" text-anchor="start">来源</text>
<text x="40" y="1763" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">FCAC · Life insurance（canada.ca）</text>
<text x="40" y="1785" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">Insurance Council of BC · Code of Conduct（客户最佳利益）</text>
<text x="40" y="1808" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">本站讲解页「评估客户处境」资本需求法与案例 C（示例数字）</text>
<text x="40" y="1836" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">示例数字出自讲解页案例 C，不代表任何真实家庭；CPP 给付按核定数额计，不能预设最高额。实际保额还要经核保，本图不推荐</text>
<text x="40" y="1856" font-size="14" fill="#5B6B7F" font-weight="400" text-anchor="start">产品。</text>
</svg>
